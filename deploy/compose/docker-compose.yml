services:
  postgres:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releasehub}
      POSTGRES_USER: ${POSTGRES_USER:-releasehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/compose/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - releasehub

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prd,real}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-releasehub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-releasehub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/compose/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/compose/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090}
      CORS_ALLOWEDORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090}
      RELEASEHUB_SEED_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - releasehub

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - releasehub

volumes:
  postgres_data:

networks:
  releasehub:
